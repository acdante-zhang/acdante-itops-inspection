version: "3.8"

services:
  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${NEXT_PORT:-5000}:3000"
    environment:
      - PYTHON_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Python Backend (Inspection Engine)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "${PYTHON_API_PORT:-8000}:8000"
    environment:
      - PYTHON_API_PORT=8000
      - ITOPS_DB_PATH=/app/backend/data/itops.db
    volumes:
      - backend-data:/app/backend/data
    restart: unless-stopped

volumes:
  backend-data:
